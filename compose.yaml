services:
  controller:
    build:
      context: .
      args:
        CONTROLLER_REVISION: ${PREVIEW_CONTROLLER_REVISION:-}
    restart: unless-stopped
    network_mode: host
    environment:
      - PREVIEW_DOMAIN
      - PREVIEW_SERVER_TOKEN
      - PREVIEW_GITHUB_TOKEN
      - PREVIEW_MANAGEMENT_LISTEN
      - PREVIEW_LISTEN
      - PREVIEW_SERVER_WORKSPACE
      - PREVIEW_STATE_ROOT
      - PREVIEW_ARCHIVE_AFTER_IDLE
      - PREVIEW_DELETE_AFTER_ARCHIVE
      - PREVIEW_DASHBOARD_ORIGIN
      - PREVIEW_DASHBOARD_ISSUER
      - PREVIEW_DASHBOARD_CLIENT_ID
      - PREVIEW_DASHBOARD_VIEW_GROUP
      - PREVIEW_DASHBOARD_OPERATE_GROUP
      - PREVIEW_MCP_ISSUER
      - PREVIEW_MCP_RESOURCE
      - PREVIEW_MCP_JWKS_URI
    volumes:
      - type: bind
        source: ${PREVIEW_PROJECTS_FILE:-./projects.json}
        target: /etc/preview-server/projects.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${PREVIEW_SERVER_WORKSPACE:-/srv/preview-server}
        target: ${PREVIEW_SERVER_WORKSPACE:-/srv/preview-server}
        bind:
          create_host_path: false
      - type: volume
        source: state
        target: ${PREVIEW_STATE_ROOT:-/var/lib/preview-server}

volumes:
  state:
