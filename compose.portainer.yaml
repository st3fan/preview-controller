services:
  controller:
    image: ${PREVIEW_SERVER_IMAGE:?Set PREVIEW_SERVER_IMAGE to a release image reference}
    restart: unless-stopped
    network_mode: host
    environment:
      - PREVIEW_SERVER_TOKEN
      - PREVIEW_GITHUB_TOKEN
    volumes:
      - type: bind
        source: ${PREVIEW_SERVER_CONFIG:-/etc/preview-server.json}
        target: /etc/preview-server.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${PREVIEW_SERVER_WORKSPACE:-/srv/preview-server}
        target: ${PREVIEW_SERVER_WORKSPACE:-/srv/preview-server}
        bind:
          create_host_path: false
      - type: volume
        source: state
        target: /var/lib/preview-server

volumes:
  state:
